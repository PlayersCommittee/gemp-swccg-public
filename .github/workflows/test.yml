---
name: test-on-push
on:
  push:
    branches:
      - master
      - main

  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: mvn build
        run: mvn clean verify
        working-directory: src

      - name: Build Docker stack
        working-directory: src
        run: |
          docker compose build

      - name: Start Docker stack
        working-directory: src
        run: |
          set -euo pipefail
          # Load env so we can reuse DB credentials/ports
          set -a
          source .env
          set +a

          # Start DB first
          docker compose up -d db
          # Wait for DB to be reachable
          timeout 180 bash -c '
            until docker compose exec -T db sh -c "mariadb-admin ping -uroot \
                -p\"$MYSQL_ROOT_PASSWORD\" --silent"; do
              echo "Waiting for DB to be ready..."
              docker compose logs --tail=20 db || true
              sleep 5
            done
          '
          # Then start app
          docker compose up -d build

      - name: Run integration tests
        working-directory: src
        timeout-minutes: 10
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # Load ports from .env so we hit the mapped host port
          set -a
          source .env
          set +a
          APP_URL="http://127.0.0.1:${APP_PORT}/gemp-swccg/index.html"

          # Wait (with visibility) for the app to start responding
          timeout 240 bash -c '
            url="$1"
            until curl -fSs --max-time 10 --output /dev/null "$url"; do
              echo "Waiting for app to respond at ${url}..."
              docker compose ps
              docker compose logs --tail=50 build || true
              docker compose exec -T build sh -c "tail -n 50 /root/nohup.out \
                || tail -n 50 /opt/gemp-swccg/src/nohup.out" || true
              sleep 5
            done
          ' bash "${APP_URL}"
          python3 -m pip install --requirement requirements.txt
          python3 -u gemp_client_test.py

      - name: Show Docker diagnostics on failure
        if: failure()
        working-directory: src
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true
